name: azatech-order

services:
  postgres:
    image: postgres:16-alpine
    container_name: azatech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: azatech_order_db
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    ports:
      # host 5434 -> container 5432
      # (5432 & 5433 di host sudah dipakai Postgres native Windows service)
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d azatech_order_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:password123@postgres:5432/azatech_order_db?schema=public
      PORT: 4000
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3200}
      API_PUBLIC_URL: ${PUBLIC_API_URL:-http://localhost:4000/api}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Run pnpm env:setup first}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Run pnpm env:setup first}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?Run pnpm env:setup first}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Run pnpm env:setup first}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-3200}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

volumes:
  pgdata:
    name: azatech_pgdata
